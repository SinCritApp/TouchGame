<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap Target</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }

  :root {
    --bg: #0a0a1a;
    --surface: #12122a;
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --danger: #ef4444;
    --text: #f8fafc;
    --muted: #94a3b8;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    touch-action: none;
  }

  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HUD */
  #hud {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: clamp(6px, 1.5vw, 12px) clamp(12px, 3vw, 24px);
    background: rgba(10,10,26,0.9);
    border-bottom: 1px solid rgba(124,58,237,0.3);
    flex-shrink: 0;
    gap: 8px;
  }

  .hud-stat { text-align: center; flex-shrink: 0; }
  .hud-label {
    font-size: clamp(9px, 1.2vw, 11px);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .hud-value {
    font-size: clamp(16px, 3.5vw, 26px);
    font-weight: 700;
    line-height: 1.1;
  }
  #score-val { color: var(--accent2); }
  #timer-val { color: var(--text); }
  #level-val { color: var(--accent); }

  /* Level progress section (middle of HUD) */
  #hud-progress {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  #level-name {
    font-size: clamp(9px, 1.4vw, 12px);
    color: var(--accent2);
    font-weight: 600;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  #progress-wrap {
    width: 100%;
    max-width: 180px;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 3px;
    transition: width 0.2s ease;
  }
  #progress-label {
    font-size: clamp(8px, 1.1vw, 10px);
    color: var(--muted);
  }

  /* Timer bar */
  #timer-bar-wrap {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,0.08);
  }
  #timer-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.1s linear, background 0.5s;
  }
  #timer-bar.low { background: linear-gradient(90deg, #ef4444, #f59e0b); }

  /* Play area */
  #arena {
    position: relative;
    flex: 1;
    overflow: hidden;
    cursor: crosshair;
  }

  /* Targets */
  .target {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.05s;
    will-change: transform;
  }
  .target:active { transform: scale(0.9); }
  .target-inner {
    border-radius: 50%;
    pointer-events: none;
  }

  /* Special targets */
  .target.bonus-target {
    animation: bonusPulse 0.5s infinite alternate;
  }
  @keyframes bonusPulse {
    from { box-shadow: 0 0 12px 4px #f59e0b88; }
    to   { box-shadow: 0 0 28px 10px #f59e0bcc; }
  }

  /* Pop FX */
  .pop {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: popOut 0.35s ease-out forwards;
  }
  @keyframes popOut {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  .score-fly {
    position: absolute;
    pointer-events: none;
    font-weight: 700;
    animation: flyUp 0.65s ease-out forwards;
    font-size: clamp(13px, 2.5vw, 20px);
    color: #fff;
    text-shadow: 0 0 8px var(--accent2);
    z-index: 20;
    white-space: nowrap;
  }
  @keyframes flyUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-65px) scale(0.7); opacity: 0; }
  }

  .time-fly {
    position: absolute;
    pointer-events: none;
    font-weight: 700;
    animation: flyUp 0.65s ease-out forwards;
    font-size: clamp(12px, 2vw, 16px);
    color: #4ade80;
    text-shadow: 0 0 8px #4ade8088;
    z-index: 20;
    white-space: nowrap;
  }

  /* Miss FX */
  #miss-flash {
    position: absolute;
    inset: 0;
    background: rgba(239,68,68,0.22);
    pointer-events: none;
    opacity: 0;
    z-index: 5;
  }
  #miss-flash.flash { animation: flashRed 0.22s ease-out; }
  @keyframes flashRed { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* Time bonus flash */
  #time-flash {
    position: absolute;
    inset: 0;
    background: rgba(74,222,128,0.12);
    pointer-events: none;
    opacity: 0;
    z-index: 5;
  }
  #time-flash.flash { animation: flashGreen 0.3s ease-out; }
  @keyframes flashGreen { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* Stars BG */
  #stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--d, 3s) infinite alternate ease-in-out;
  }
  @keyframes twinkle { from { opacity: 0.1; } to { opacity: 0.7; } }

  /* Overlay screens */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10,10,26,0.93);
    padding: clamp(12px, 3vw, 36px);
    text-align: center;
    gap: clamp(10px, 2.5vh, 20px);
    overflow-y: auto;
  }
  .overlay.hidden { display: none; }

  .overlay h1 {
    font-size: clamp(26px, 6vw, 52px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
  }

  .overlay p {
    font-size: clamp(12px, 2vw, 16px);
    color: var(--muted);
    max-width: 440px;
    line-height: 1.6;
  }

  .btn {
    background: linear-gradient(135deg, var(--accent), #5b21b6);
    color: white;
    border: none;
    border-radius: 50px;
    padding: clamp(11px, 2vw, 15px) clamp(24px, 5vw, 44px);
    font-size: clamp(13px, 2.2vw, 17px);
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    box-shadow: 0 0 24px rgba(124,58,237,0.5);
    transition: transform 0.1s, box-shadow 0.1s;
    touch-action: manipulation;
  }
  .btn:hover { transform: scale(1.04); box-shadow: 0 0 32px rgba(124,58,237,0.7); }
  .btn:active { transform: scale(0.97); }

  /* Level plan table */
  .level-plan {
    width: 100%;
    max-width: 460px;
    border-collapse: collapse;
    font-size: clamp(11px, 1.8vw, 13px);
  }
  .level-plan th {
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 4px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-weight: 500;
  }
  .level-plan td {
    padding: 6px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    color: var(--text);
    vertical-align: middle;
  }
  .level-plan tr:last-child td { border-bottom: none; }
  .level-plan .lv-num {
    font-weight: 700;
    color: var(--accent);
    font-size: clamp(12px, 2vw, 15px);
  }
  .level-plan .lv-name { color: var(--accent2); font-weight: 600; }
  .level-plan .lv-bonus { color: #4ade80; font-weight: 600; }
  .plan-heading {
    font-size: clamp(11px, 1.8vw, 13px);
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    align-self: flex-start;
    margin-left: auto; margin-right: auto;
  }

  .result-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 360px;
  }
  .result-box {
    background: var(--surface);
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 12px;
    padding: 10px 6px;
  }
  .result-box .rl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .result-box .rv { font-size: clamp(17px, 3.5vw, 24px); font-weight: 700; }

  /* Level up banner */
  #level-up {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 50;
    background: rgba(10,10,26,0.92);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 14px 28px;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    min-width: 180px;
  }
  #level-up.show { animation: levelPop 1.4s ease-out forwards; }
  @keyframes levelPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    30%  { transform: translate(-50%, -50%) scale(1); }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
  }
  #level-up .lu-tag   { font-size: 10px; color: var(--accent2); text-transform: uppercase; letter-spacing: 2px; }
  #level-up .lu-name  { font-size: clamp(14px, 3vw, 20px); font-weight: 800; color: white; margin: 2px 0; }
  #level-up .lu-bonus { font-size: clamp(11px, 2vw, 13px); color: #4ade80; }

  /* Haptics toggle */
  #haptic-btn {
    position: absolute;
    top: 8px; right: 10px;
    z-index: 200;
    background: none;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: var(--muted);
    font-size: 17px;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  #haptic-btn.on { color: var(--accent2); border-color: var(--accent2); }
</style>
</head>
<body>
<div id="game">

  <!-- HUD -->
  <div id="hud">
    <div class="hud-stat">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="score-val">0</div>
    </div>

    <div id="hud-progress">
      <div id="level-name">Recruit</div>
      <div id="progress-wrap"><div id="progress-bar" style="width:0%"></div></div>
      <div id="progress-label">0 / 8</div>
    </div>

    <div class="hud-stat">
      <div class="hud-label">Time</div>
      <div class="hud-value" id="timer-val">30</div>
    </div>
    <div class="hud-stat">
      <div class="hud-label">Lv</div>
      <div class="hud-value" id="level-val">1</div>
    </div>
    <div id="timer-bar-wrap"><div id="timer-bar" style="width:100%"></div></div>
  </div>

  <!-- Arena -->
  <div id="arena">
    <div id="stars"></div>
    <div id="miss-flash"></div>
    <div id="time-flash"></div>
    <div id="level-up">
      <div class="lu-tag">Level up!</div>
      <div class="lu-name" id="lu-name">Scout</div>
      <div class="lu-bonus" id="lu-bonus">+5s bonus!</div>
    </div>
  </div>

  <button id="haptic-btn" title="Toggle haptic feedback" aria-label="Toggle haptic feedback">📳</button>

  <!-- Start Screen -->
  <div class="overlay" id="screen-start">
    <h1>Tap Target</h1>
    <p>Hit targets before they vanish. Each hit earns time. Level up for bigger bonuses!</p>

    <div class="plan-heading">Level plan</div>
    <table class="level-plan">
      <thead>
        <tr>
          <th>Lv</th><th>Name</th><th>Targets to unlock</th><th>Hit bonus</th><th>Level-up bonus</th>
        </tr>
      </thead>
      <tbody id="plan-tbody"></tbody>
    </table>

    <button class="btn" id="btn-start">Play</button>
  </div>

  <!-- Game Over Screen -->
  <div class="overlay hidden" id="screen-over">
    <h1>Time's up!</h1>
    <div class="result-grid">
      <div class="result-box">
        <div class="rl">Score</div>
        <div class="rv" id="final-score" style="color:var(--accent2)">0</div>
      </div>
      <div class="result-box">
        <div class="rl">Level</div>
        <div class="rv" id="final-level" style="color:var(--accent)">1</div>
      </div>
      <div class="result-box">
        <div class="rl">Best</div>
        <div class="rv" id="final-best" style="color:#f59e0b">0</div>
      </div>
    </div>
    <button class="btn" id="btn-restart">Play again</button>
    <p style="font-size:11px;color:var(--muted);margin-top:-4px">Thanks for playing!</p>
  </div>

</div>

<script>
// ─── LEVEL PLAN ───────────────────────────────────────────────────────────────
// Each level: name, targets needed to reach it (cumulative), time per hit (s), level-up bonus (s)
const LEVELS = [
  { name:'Recruit',  targetsNeeded:0,   hitBonus:0.5, levelBonus:0,  spawnMs:1200, lifeMs:2000, maxT:2, minSz:60, maxSz:90 },
  { name:'Scout',    targetsNeeded:8,   hitBonus:0.6, levelBonus:5,  spawnMs:1100, lifeMs:1850, maxT:3, minSz:56, maxSz:86 },
  { name:'Hunter',   targetsNeeded:18,  hitBonus:0.7, levelBonus:5,  spawnMs:980,  lifeMs:1700, maxT:3, minSz:52, maxSz:80 },
  { name:'Tracker',  targetsNeeded:32,  hitBonus:0.8, levelBonus:6,  spawnMs:860,  lifeMs:1550, maxT:4, minSz:48, maxSz:74 },
  { name:'Sniper',   targetsNeeded:50,  hitBonus:0.9, levelBonus:6,  spawnMs:740,  lifeMs:1380, maxT:4, minSz:44, maxSz:68 },
  { name:'Ace',      targetsNeeded:72,  hitBonus:1.0, levelBonus:7,  spawnMs:640,  lifeMs:1200, maxT:5, minSz:40, maxSz:62 },
  { name:'Elite',    targetsNeeded:98,  hitBonus:1.1, levelBonus:7,  spawnMs:560,  lifeMs:1050, maxT:5, minSz:36, maxSz:56 },
  { name:'Legend',   targetsNeeded:128, hitBonus:1.2, levelBonus:8,  spawnMs:500,  lifeMs:900,  maxT:6, minSz:32, maxSz:50 },
  { name:'Mythic',   targetsNeeded:164, hitBonus:1.3, levelBonus:9,  spawnMs:450,  lifeMs:780,  maxT:6, minSz:29, maxSz:45 },
  { name:'Phantom',  targetsNeeded:206, hitBonus:1.5, levelBonus:10, spawnMs:400,  lifeMs:680,  maxT:6, minSz:26, maxSz:40 },
];

// Build plan table on start screen
const tbody = document.getElementById('plan-tbody');
LEVELS.forEach((lv, i) => {
  const tr = document.createElement('tr');
  const need = i === 0 ? '—' : lv.targetsNeeded;
  tr.innerHTML = `<td class="lv-num">${i+1}</td><td class="lv-name">${lv.name}</td><td style="color:var(--muted)">${need}</td><td style="color:var(--accent2)">+${lv.hitBonus}s</td><td class="lv-bonus">${i===0?'—':'+'+lv.levelBonus+'s'}</td>`;
  tbody.appendChild(tr);
});

// ─── DOM refs ─────────────────────────────────────────────────────────────────
const arena       = document.getElementById('arena');
const scoreEl     = document.getElementById('score-val');
const timerEl     = document.getElementById('timer-val');
const levelEl     = document.getElementById('level-val');
const levelNameEl = document.getElementById('level-name');
const timerBar    = document.getElementById('timer-bar');
const progressBar = document.getElementById('progress-bar');
const progressLbl = document.getElementById('progress-label');
const missFlash   = document.getElementById('miss-flash');
const timeFlash   = document.getElementById('time-flash');
const levelUpEl   = document.getElementById('level-up');
const luName      = document.getElementById('lu-name');
const luBonus     = document.getElementById('lu-bonus');
const screenStart = document.getElementById('screen-start');
const screenOver  = document.getElementById('screen-over');
const hapticBtn   = document.getElementById('haptic-btn');

// ─── State ────────────────────────────────────────────────────────────────────
let score = 0, levelIdx = 0, bestScore = 0;
let timeLeft = 30, totalTime = 30;
let targets = [], spawnTimer = null;
let running = false, hapticOn = true, lastTick = 0;
let targetsHitTotal = 0;
let arenaW = 0, arenaH = 0;

// ─── Haptic toggle ────────────────────────────────────────────────────────────
hapticBtn.addEventListener('click', e => {
  e.stopPropagation();
  hapticOn = !hapticOn;
  hapticBtn.textContent = hapticOn ? '📳' : '🔕';
  hapticBtn.classList.toggle('on', hapticOn);
});
function vibrate(ms=30) { if (hapticOn && navigator.vibrate) navigator.vibrate(ms); }

// ─── Stars ────────────────────────────────────────────────────────────────────
function makeStars() {
  const s = document.getElementById('stars');
  s.innerHTML = '';
  const n = Math.min(80, Math.floor((window.innerWidth * window.innerHeight) / 8000));
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'star';
    const sz = Math.random() * 2 + 1;
    el.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*3+1.5).toFixed(1)}s;animation-delay:${(Math.random()*3).toFixed(1)}s`;
    s.appendChild(el);
  }
}
makeStars();
window.addEventListener('resize', () => { makeStars(); updateArenaSize(); });
function updateArenaSize() { const r = arena.getBoundingClientRect(); arenaW = r.width; arenaH = r.height; }

// ─── Level helpers ────────────────────────────────────────────────────────────
function currentLevel() { return LEVELS[Math.min(levelIdx, LEVELS.length - 1)]; }
function nextLevel()    { return LEVELS[Math.min(levelIdx + 1, LEVELS.length - 1)]; }

function updateLevelHUD() {
  const lv = currentLevel();
  const next = nextLevel();
  levelEl.textContent  = levelIdx + 1;
  levelNameEl.textContent = lv.name;
  const hitsIntoLevel = targetsHitTotal - lv.targetsNeeded;
  const hitsNeeded    = levelIdx < LEVELS.length - 1
    ? next.targetsNeeded - lv.targetsNeeded
    : '∞';
  const pct = typeof hitsNeeded === 'number'
    ? Math.min(100, (hitsIntoLevel / hitsNeeded) * 100)
    : 100;
  progressBar.style.width = pct + '%';
  progressLbl.textContent = typeof hitsNeeded === 'number'
    ? `${hitsIntoLevel} / ${hitsNeeded}`
    : 'MAX LEVEL';
}

// ─── Colors ───────────────────────────────────────────────────────────────────
const COLORS = [
  ['#7c3aed','#5b21b6'],
  ['#06b6d4','#0284c7'],
  ['#10b981','#059669'],
  ['#f59e0b','#d97706'],
  ['#ec4899','#be185d'],
];

// ─── Spawn ────────────────────────────────────────────────────────────────────
function spawnTarget() {
  if (!running) return;
  const cfg = currentLevel();
  if (targets.length >= cfg.maxT) return;
  updateArenaSize();
  const size = Math.random() * (cfg.maxSz - cfg.minSz) + cfg.minSz;
  const pad  = size / 2 + 8;
  const x    = Math.random() * (arenaW - pad * 2) + pad;
  const y    = Math.random() * (arenaH - pad * 2) + pad;
  // Occasional bonus (golden) target — more likely at higher levels
  const isBonus = Math.random() < (0.05 + levelIdx * 0.02);
  const col = isBonus
    ? ['#f59e0b','#d97706']
    : COLORS[Math.floor(Math.random() * COLORS.length)];
  const spawnTime = performance.now();

  const el = document.createElement('div');
  el.className = 'target' + (isBonus ? ' bonus-target' : '');
  el.style.cssText = `width:${size}px;height:${size}px;left:${x-size/2}px;top:${y-size/2}px;background:radial-gradient(circle at 35% 35%, ${col[0]}, ${col[1]});box-shadow:0 0 ${size*0.4}px ${col[0]}88;`;

  const inner = document.createElement('div');
  inner.className = 'target-inner';
  inner.style.cssText = `width:${size*0.45}px;height:${size*0.45}px;background:rgba(255,255,255,0.2);`;
  el.appendChild(inner);

  const ring = document.createElement('div');
  ring.style.cssText = `position:absolute;inset:-4px;border-radius:50%;border:2px solid ${col[0]};animation:shrinkRing ${cfg.lifeMs}ms linear forwards;`;
  el.appendChild(ring);

  const obj = { el, spawnTime, life: cfg.lifeMs, col, isBonus };
  targets.push(obj);
  arena.appendChild(el);

  el.style.transform = 'scale(0)';
  el.style.transition = 'transform 0.12s cubic-bezier(0.175,0.885,0.32,1.275)';
  requestAnimationFrame(() => { el.style.transform = 'scale(1)'; });

  el.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    if (!running) return;
    hitTarget(obj, x, y);
  });

  obj.timeout = setTimeout(() => {
    if (!running) return;
    expireTarget(obj);
  }, cfg.lifeMs);
}

// ─── Hit ──────────────────────────────────────────────────────────────────────
function hitTarget(obj, x, y) {
  removeTarget(obj);
  vibrate(25);

  const age   = performance.now() - obj.spawnTime;
  const speed = age < 400 ? 3 : age < 800 ? 2 : 1;
  const lv    = currentLevel();
  const pts   = 10 * speed * (levelIdx + 1) * (obj.isBonus ? 2 : 1);
  score += pts;
  targetsHitTotal++;
  scoreEl.textContent = score;

  // Time bonus per hit
  const tBonus = lv.hitBonus * (obj.isBonus ? 2 : 1);
  addTime(tBonus, x, y - 20);

  popFX(x, y, obj.col[0]);
  flyScore(`+${pts}`, x, y);
  checkLevelUp();
  updateLevelHUD();
}

function addTime(secs, x, y) {
  timeLeft = Math.min(timeLeft + secs, 99);
  totalTime = Math.max(totalTime, timeLeft);

  // Green flash
  timeFlash.classList.remove('flash');
  void timeFlash.offsetWidth;
  timeFlash.classList.add('flash');

  // Floating text
  const el = document.createElement('div');
  el.className = 'time-fly';
  el.textContent = `+${secs.toFixed(1)}s`;
  el.style.left = (x - 24) + 'px';
  el.style.top  = y + 'px';
  arena.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 700);
}

// ─── Level up ─────────────────────────────────────────────────────────────────
function checkLevelUp() {
  if (levelIdx >= LEVELS.length - 1) return;
  const next = LEVELS[levelIdx + 1];
  if (targetsHitTotal >= next.targetsNeeded) {
    levelIdx++;
    const lv = currentLevel();

    // Level-up time bonus
    addTime(lv.levelBonus, arenaW / 2, arenaH / 2 - 40);

    luName.textContent  = lv.name;
    luBonus.textContent = `+${lv.levelBonus}s time bonus!`;
    levelUpEl.classList.remove('show');
    void levelUpEl.offsetWidth;
    levelUpEl.classList.add('show');
    vibrate(60);

    clearInterval(spawnTimer);
    scheduleSpawn();
    updateLevelHUD();
  }
}

// ─── Expire / remove ──────────────────────────────────────────────────────────
function expireTarget(obj) {
  const el = obj.el;
  el.style.transition = 'transform 0.15s ease-in, opacity 0.15s ease-in';
  el.style.transform  = 'scale(0)';
  el.style.opacity    = '0';
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 160);
  targets = targets.filter(t => t !== obj);
  missFlash.classList.remove('flash');
  void missFlash.offsetWidth;
  missFlash.classList.add('flash');
  vibrate(10);
}

function removeTarget(obj) {
  clearTimeout(obj.timeout);
  const el = obj.el;
  el.style.transition = 'transform 0.1s ease-in';
  el.style.transform  = 'scale(0)';
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 100);
  targets = targets.filter(t => t !== obj);
}

// ─── FX ───────────────────────────────────────────────────────────────────────
function popFX(x, y, color) {
  const pop = document.createElement('div');
  pop.className = 'pop';
  const sz = 40;
  pop.style.cssText = `width:${sz}px;height:${sz}px;left:${x-sz/2}px;top:${y-sz/2}px;background:${color};opacity:0.6;z-index:30;`;
  arena.appendChild(pop);
  setTimeout(() => { if (pop.parentNode) pop.parentNode.removeChild(pop); }, 400);
}

function flyScore(text, x, y) {
  const el = document.createElement('div');
  el.className = 'score-fly';
  el.textContent = text;
  el.style.left = (x - 20) + 'px';
  el.style.top  = (y - 24) + 'px';
  arena.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 700);
}

// Inject shrink keyframe
const styleTag = document.createElement('style');
styleTag.textContent = '@keyframes shrinkRing{from{transform:scale(1);opacity:0.8}to{transform:scale(0.1);opacity:0}}';
document.head.appendChild(styleTag);

// ─── Spawn scheduler ──────────────────────────────────────────────────────────
function scheduleSpawn() {
  const cfg = currentLevel();
  spawnTimer = setInterval(spawnTarget, cfg.spawnMs);
  spawnTarget();
}

// ─── Game loop ────────────────────────────────────────────────────────────────
function tick(now) {
  if (!running) return;
  if (!lastTick) lastTick = now;
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  timeLeft = Math.max(0, timeLeft - dt);
  timerEl.textContent = Math.ceil(timeLeft);
  timerBar.style.width = (timeLeft / totalTime * 100) + '%';
  timerBar.classList.toggle('low', timeLeft <= 8);
  if (timeLeft <= 0) { endGame(); return; }
  requestAnimationFrame(tick);
}

// ─── Start / End ──────────────────────────────────────────────────────────────
function startGame() {
  score = 0; levelIdx = 0; timeLeft = 30; totalTime = 30; lastTick = 0;
  targetsHitTotal = 0;
  targets = [];
  scoreEl.textContent = '0';
  timerEl.textContent = '30';
  timerBar.style.width = '100%';
  timerBar.classList.remove('low');
  arena.querySelectorAll('.target, .pop, .score-fly, .time-fly').forEach(e => e.remove());
  screenStart.classList.add('hidden');
  screenOver.classList.add('hidden');
  running = true;
  updateArenaSize();
  updateLevelHUD();
  scheduleSpawn();
  requestAnimationFrame(tick);
}

function endGame() {
  running = false;
  clearInterval(spawnTimer);
  targets.forEach(t => { clearTimeout(t.timeout); if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
  targets = [];
  if (score > bestScore) bestScore = score;
  document.getElementById('final-score').textContent = score;
  document.getElementById('final-level').textContent = levelIdx + 1;
  document.getElementById('final-best').textContent  = bestScore;
  screenOver.classList.remove('hidden');
}

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', startGame);

// Miss on empty arena
arena.addEventListener('pointerdown', e => {
  if (!running) return;
  if (e.target === arena || e.target.id === 'stars' || e.target.id === 'miss-flash' || e.target.id === 'time-flash') {
    missFlash.classList.remove('flash');
    void missFlash.offsetWidth;
    missFlash.classList.add('flash');
    vibrate(8);
  }
});

// Esc key — Playables compliant (no preventDefault on global esc)
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { /* let platform handle it */ }
});
</script>
</body>
